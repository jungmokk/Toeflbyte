name: Server Keep-Alive

on:
  schedule:
    # 10분마다 실행하여 Render 서버 슬립(15분 타임아웃) 및 Supabase 휴면 방지
    - cron: '*/10 * * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  ping-servers:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Server
        run: |
          echo "Pinging Render Backend..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://toeflbyte.onrender.com/health || echo "000")
          echo "Render Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::warning ::Render server returned $HTTP_STATUS or timed out. Retrying in 10s..."
            sleep 10
            curl -s -f --max-time 60 https://toeflbyte.onrender.com/health || true
          fi

      - name: Ping Supabase Project
        run: |
          echo "Pinging Supabase..."
          SUPABASE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://fpvtolzqnmbckfjvsnsy.supabase.co/rest/v1/ || echo "000")
          echo "Supabase Status: $SUPABASE_STATUS"
